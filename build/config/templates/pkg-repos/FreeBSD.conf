# the internal development record: the base system's repositories are off on the appliance, as on TrueNAS CORE 13.3.
# FreeBSD 15 names them FreeBSD-ports and FreeBSD-ports-kmods (13.x had one, "FreeBSD").
# Software belongs in a jail; the host is updated by its own update train.
FreeBSD-ports: {
    enabled: no
}
FreeBSD-ports-kmods: {
    enabled: no
}
