NO_ZFS=${no_zfs}
ZPOOL=${ZPOOL}
ZROOTFS=${ZROOTFS}
RESOLV_CONF=/etc/resolv.conf
BASEFS=${OBJDIR}/ports
USE_PORTLINT=no
USE_TMPFS=yes
GIT_URL=${ports_repo}
GIT_BRANCH=${ports_branch}
DISTFILES_CACHE=${DISTFILES_CACHE}
ALLOW_MAKE_JOBS=yes

# Bound both per-port and concurrent work so large C++, Rust, and Go builds do
# not exhaust the release builder's memory. Individual heavy ports carry their
# own make.conf overrides within this ceiling.
MAKE_JOBS_NUMBER_LIMIT=8
PARALLEL_JOBS=3

RESTRICT_NETWORKING=no
BUILD_AS_NON_ROOT=no

# Toolchain and browser ports can have long silent link/package phases.
NOHANG_TIME=28800
MAX_EXECUTION_TIME=43200
