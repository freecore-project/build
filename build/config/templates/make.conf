# Per-port MAKE_JOBS caps for memory-heavy builds that OOM even with
# poudriere.conf's global MAKE_JOBS_NUMBER_LIMIT=4. V8 (node24) and rustc
# allocate GB-per-translation-unit, so tighten further for those ports.
#
# This file is appended to ${POUDRIERE_ROOT}/etc/poudriere.d/make.conf by
# build-ports.py (after the make_conf_pkg dict).  Poudriere loads it per
# poudriere.8(8) "make.conf" section.
.if ${.CURDIR:M*/node24}
MAKE_JOBS_NUMBER=8
.endif

.if ${.CURDIR:M*/rust}
# Rust bootstrap = LLVM C++ compile (heavy CGDebugInfo.cpp etc.) + final
# ld linker for libclang-cpp.so (single 20+ GB process).  At 24 GB VM
# we OOM'd at -j 8 during compile; at 64 GB we OOM'd at -j 4 during
# the LINKER step (single big ld).  At 128 GB / 12-core (NUMA-friendly
# single-socket Ivy Bridge layout) headroom for -j 8 + 20 GB linker
# peak + ARC + other concurrent ports is comfortable.
MAKE_JOBS_NUMBER=8
RUSTC_BOOTSTRAP_JOBS=8
.endif
